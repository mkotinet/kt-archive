version: '3.8'

services:
  kt-archive:
    container_name: kt-archive
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5180:5180"
    environment:
      - PORT=5180
      - TZ=Asia/Seoul
      - DATA_DIR=/app/data
      - DOWNLOAD_DIR=/downloads/KakaoArchive
      - WEBHOOK_SECRET=danminlove-kt-secret-key-2026
      - NODE_ENV=production
    volumes:
      - /volume2/docker/kt-archive:/app
      - /volume1/Download:/downloads
    command: sh -c "apk add --no-cache tzdata && cp /usr/share/zoneinfo/Asia/Seoul /etc/localtime && echo Asia/Seoul > /etc/timezone && npm install --omit=dev && node src/server.js"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
